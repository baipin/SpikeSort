services:
  influxdb:
    image: influxdb:2.7
    container_name: esp32s3-bandwidth-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: bandwidth-admin-pass
      DOCKER_INFLUXDB_INIT_ORG: neural-link-lab
      DOCKER_INFLUXDB_INIT_BUCKET: esp32s3_bandwidth
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: bandwidth-monitor-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: esp32s3-bandwidth-grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bandwidth-admin-pass
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
